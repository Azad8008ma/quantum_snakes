# .github/workflows/build-android.yml

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install minimal dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          openjdk-11-jdk \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libltdl-dev

    - name: Install Python packages
      run: |
        pip install --upgrade pip
        pip install buildozer cython
        # فقط کتابخانه‌های اصلی رو نصب کن
        pip install kivy==2.3.0 kivymd==1.1.1

    - name: Build APK with Buildozer
      run: |
        # از buildozer استفاده کن که خودش وابستگی‌ها رو مدیریت کنه
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quantum-snakes-apk
        path: bin/*.apk
