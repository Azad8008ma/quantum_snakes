name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-20.04  # استفاده از نسخه پایدارتر

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev libltdl-dev \
          python3-pip

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==2.0.0 cython==0.29.36

    - name: Fix buildozer.spec
      run: |
        sed -i 's/,audiostream//g' buildozer.spec
        sed -i 's/audiostream,//g' buildozer.spec
        sed -i 's/,,/,/g' buildozer.spec
        cat buildozer.spec

    - name: Setup Android environment
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

    - name: Build APK
      run: |
        # قبول خودکار لایسنس‌ها
        yes | sdkmanager --licenses || true
        buildozer -y android debug
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QuantumSnake-APK
        path: bin/*.apk
